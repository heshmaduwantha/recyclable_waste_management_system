<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich Eco Emerald to Forest Green -->
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Leaf Glow Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="50%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#BEF264" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#052E16" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect width="512" height="512" rx="116" fill="url(#ecoBg)" />

  <!-- Crisp Inner Highlight Border -->
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6" />

  <!-- High-contrast Recyclable Loop Symbol (Thick arrows for 16px/32px legibility) -->
  <g filter="url(#iconShadow)" transform="translate(68, 68) scale(15.67)" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Right Ribbon -->
    <path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5" />
    <!-- Bottom Ribbon -->
    <path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12" />
    <!-- Bottom-Left Arrowhead -->
    <path d="m14 16-3 3 3 3" />
    <!-- Top-Left Arrowhead -->
    <path d="M8.293 13.596 7.196 9.5 3.1 10.598" />
    <!-- Top-Center Ribbon -->
    <path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843" />
    <!-- Right Arrowhead -->
    <path d="m13.378 9.633 4.096 1.098 1.097-4.096" />
  </g>

  <!-- Central Eco Sprout / Leaf Motif (Signifying Sustainable Green Renewal) -->
  <g filter="url(#iconShadow)" transform="translate(256, 268)">
    <!-- Primary Green Eco Leaf -->
    <path d="M0,46 C-34,16 -44,-22 0,-76 C44,-22 34,16 0,46 Z" fill="url(#leafGrad)" />
    <!-- Central Leaf Vein -->
    <path d="M0,42 Q0,-12 0,-64" stroke="#15803D" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.65" />
    <!-- Small Sprout Bud Accent -->
    <circle cx="0" cy="-76" r="6" fill="#FEF08A" />
  </g>
</svg>
